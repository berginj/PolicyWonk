name: Deploy Web App

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: webapp
        run: npm install

      - name: Build
        working-directory: webapp
        run: npm run build
        env:
          VITE_API_BASE_URL: https://func-pwonk-v2.azurewebsites.net/api

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'webapp/dist'
          output_location: ''
          skip_app_build: true
          skip_api_build: true
