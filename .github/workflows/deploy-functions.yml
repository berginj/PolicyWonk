name: Deploy Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: functions
        run: npm install

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-pwonk-v2
          package: functions

      - name: Sync function triggers
        run: |
          az functionapp config appsettings set --name func-pwonk-v2 --resource-group rg-pwonk-prod --settings "DEPLOYMENT_TIMESTAMP=$(date +%s)"
          az rest --method post --uri "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-pwonk-prod/providers/Microsoft.Web/sites/func-pwonk-v2/syncfunctiontriggers?api-version=2022-03-01"

      - name: Restart Function App
        run: |
          az functionapp restart --name func-pwonk-v2 --resource-group rg-pwonk-prod
